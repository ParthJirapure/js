
<!DOCTYPE html>
<html>
<head>
<title>To-Do List</title>
<style>
body {
    font-family: Arial;
    background: #f0f2f5;
    padding: 30px;
}
.container {
    max-width: 550px;
    margin: 50px auto;
    padding: 25px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 3px 12px #ccc;
}
h1 { text-align: center; color: #333; }
.details {
    background: #f5f5f5;
    padding: 12px;
    text-align: center;
    border-radius: 8px;
}
input {
    padding: 12px;
    width: 65%;
    border: 1px solid #ccc;
    border-radius: 6px;
}
button {
    padding: 10px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    color: white;
    background: #34495e;
}
button:hover { background: #2c3e50; }
li {
    display: flex;
    justify-content: space-between;
    margin: 10px 0;
    padding: 10px;
    background: #f5f5f5;
    border-radius: 6px;
}
.completed { text-decoration: line-through; color: gray; }
</style>
</head>
<body>
<div class="container">
<h1>To-Do List</h1>
<br>
<input id="task" placeholder="Enter a task">
<button onclick="addTask()">Add</button>
<ul id="list"></ul>
</div>
<script src="script.js"></script>
</body>
</html>
